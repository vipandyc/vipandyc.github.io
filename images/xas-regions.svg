<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">Schematic regions of an X-ray absorption spectrum</title>
  <desc id="desc">Absorption coefficient versus photon energy, showing weak pre-edge peaks, the sharp absorption edge and XANES structure, and damped EXAFS oscillations.</desc>
  <rect width="1000" height="420" fill="#ffffff"/>
  <rect x="90" y="54" width="205" height="286" fill="#f4ecf7"/>
  <rect x="295" y="54" width="275" height="286" fill="#eaf2f8"/>
  <rect x="570" y="54" width="365" height="286" fill="#eafaf1"/>
  <line x1="90" y1="340" x2="950" y2="340" stroke="#222" stroke-width="2"/>
  <line x1="90" y1="340" x2="90" y2="35" stroke="#222" stroke-width="2"/>
  <line x1="295" y1="54" x2="295" y2="340" stroke="#777" stroke-width="1.5" stroke-dasharray="7 7"/>
  <line x1="570" y1="54" x2="570" y2="340" stroke="#777" stroke-width="1.5" stroke-dasharray="7 7"/>
  <path d="M90 315 C135 314 165 312 190 310 C205 309 210 274 222 274 C234 274 240 308 252 308 C267 307 279 306 294 304 C303 302 306 236 316 158 C325 88 337 82 349 151 C359 205 369 128 382 143 C396 159 405 214 420 188 C435 162 444 203 458 221 C474 241 485 198 501 216 C517 235 530 217 548 230 C563 242 570 230 584 240 C599 251 613 226 628 230 C644 235 660 259 676 255 C692 251 708 230 724 237 C740 245 754 269 770 267 C786 265 803 245 819 251 C836 258 851 278 868 275 C887 271 904 258 930 269"
        fill="none" stroke="#195f8a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="192" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#5b2c6f">Pre-edge</text>
  <text x="432" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1f618d">XANES</text>
  <text x="752" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#196f3d">EXAFS</text>
  <text x="192" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#444">bound / weak transitions</text>
  <text x="432" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#444">core hole + multiple scattering</text>
  <text x="752" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#444">photoelectron interference</text>
  <text x="295" y="369" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#333">E₀</text>
  <text x="520" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#222">photon energy E</text>
  <text x="25" y="210" text-anchor="middle" transform="rotate(-90 25 210)" font-family="Arial, sans-serif" font-size="20" fill="#222">absorption μ(E)</text>
</svg>
